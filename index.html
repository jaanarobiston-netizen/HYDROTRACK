<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hydrotrack Dashboard & Login</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #fafafa; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 340px; text-align: center; }
        .admin-panel { width: 500px; display: none; text-align: left; }
        h2, h3 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #000; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 12px; font-size: 14px; }
        button:hover { background: #222; }
        button.admin-btn { background: #007bff; }
        button.admin-btn:hover { background: #0056b3; }
        button.logout-btn { background: #dc3545; }
        button.logout-btn:hover { background: #bd2130; }
        .error { color: #ff3b30; font-size: 14px; margin-top: 12px; min-height: 20px; text-align: center; }
        ul { list-style: none; padding: 0; }
        li { background: #eee; padding: 8px; margin: 4px 0; border-radius: 4px; display: flex; justify-content: space-between; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div class="card" id="login-screen">
        <h2>Hydrotrack Login</h2>
        <input type="text" id="login-username" placeholder="Username" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button onclick="checkLogin()">Login</button>
        <div class="error" id="error-message"></div>
    </div>

    <!-- 2. ADMIN DASHBOARD -->
    <div class="card admin-panel" id="admin-dashboard">
        <h2>Hydrotrack Admin Dashboard</h2>
        <p>Welcome, Admin! Create new login credentials on the spot below:</p>
        
        <div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3>Create New User</h3>
            <input type="text" id="new-username" placeholder="Enter New Username">
            <input type="password" id="new-password" placeholder="Enter New Password">
            <button class="admin-btn" onclick="createUser()">Add User Credentials</button>
        </div>

        <h3>Active Users List</h3>
        <ul id="users-list"></ul>

        <button class="logout-btn" onclick="logout()">Logout Admin</button>
    </div>

    <script>
        // MASTER ADMIN CREDENTIALS (CHANGE THESE IF YOU WANT)
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        if (!localStorage.getItem('registeredUsers')) {
            localStorage.setItem('registeredUsers', JSON.stringify([]));
        }

        function checkLogin() {
            const userIn = document.getElementById('login-username').value;
            const passIn = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('error-message');

            if (userIn === ADMIN_USER && passIn === ADMIN_PASS) {
                showAdminDashboard();
                return;
            }

            const users = JSON.parse(localStorage.getItem('registeredUsers'));
            const foundUser = users.find(u => u.username === userIn && u.password === passIn);

            if (foundUser) {
                alert(`Success! Logged in as: ${userIn}`);
                logout(); 
            } else {
                errorMsg.innerText = "Invalid credentials. Try again.";
            }
        }

        function createUser() {
            const newU = document.getElementById('new-username').value.trim();
            const newP = document.getElementById('new-password').value.trim();

            if (!newU || !newP) {
                alert("Please fill out both fields!");
                return;
            }

            const users = JSON.parse(localStorage.getItem('registeredUsers'));
            
            if (users.some(u => u.username === newU) || newU === ADMIN_USER) {
                alert("This username already exists!");
                return;
            }

            users.push({ username: newU, password: newP });
            localStorage.setItem('registeredUsers', JSON.stringify(users));

            document.getElementById('new-username').value = "";
            document.getElementById('new-password').value = "";
            renderUsersList();
            alert(`User "${newU}" created successfully!`);
        }

        function renderUsersList() {
            const listElement = document.getElementById('users-list');
            listElement.innerHTML = "";
            const users = JSON.parse(localStorage.getItem('registeredUsers'));
            
            users.forEach(u => {
                const li = document.createElement('li');
                li.innerHTML = `<span><strong>User:</strong> ${u.username}</span> <span><strong>Pass:</strong> ${u.password}</span>`;
                listElement.appendChild(li);
            });
        }

        function showAdminDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            renderUsersList();
        }

        function logout() {
            document.getElementById('login-username').value = "";
            document.getElementById('login-password').value = "";
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('admin-dashboard').style.display = 'none';
            document.getElementById('error-message').innerText = "";
        }
    </script>
</body>
</html>
